<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Leave System</title>

    <!-- Bootstrap (optional but useful) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .container-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
    </style>
</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Leave System</a>

        <div>
            {% if user.is_authenticated %}
                <span class="text-white me-3">Hello, {{ user.username }}</span>

                <a href="/leave/employee/" class="btn btn-sm btn-primary">Employee</a>
                <a href="/leave/manager/" class="btn btn-sm btn-warning">Manager</a>

                <a href="/logout/" class="btn btn-sm btn-danger">Logout</a>
            {% else %}
                <a href="/login/" class="btn btn-sm btn-success">Login</a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- 📦 CONTENT -->
<div class="container">
    <div class="container-box">

        {% block content %}
        <!-- Page content வரும் இடம் -->
        {% endblock %}

    </div>
</div>

</body>
</html>
