<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }

        .btn-apply {
            background-color: #28a745;
        }

        .btn-logout {
            background-color: #dc3545;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background-color: #007bff;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .status-approved {
            color: green;
            font-weight: bold;
        }

        .status-pending {
            color: orange;
            font-weight: bold;
        }

        .status-rejected {
            color: red;
            font-weight: bold;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Employee Dashboard</h2>

    <div class="top-bar">
        <a href="{% url 'apply_leave' %}" class="btn btn-apply">+ Apply Leave</a>
        <a href="{% url 'logout' %}" class="btn btn-logout">Logout</a>
    </div>

    <table>
        <tr>
            <th>Reason</th>
            <th>From</th>
            <th>To</th>
            <th>Status</th>
        </tr>

        {% for leave in leaves %}
        <tr>
            <td>{{ leave.reason }}</td>
            <td>{{ leave.from_date }}</td>
            <td>{{ leave.to_date }}</td>
            <td>
                {% if leave.status == "Approved" %}
                    <span class="status-approved">Approved</span>
                {% elif leave.status == "Rejected" %}
                    <span class="status-rejected">Rejected</span>
                {% else %}
                    <span class="status-pending">Pending</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
