<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 40%;
            margin: 60px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #218838;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Apply Leave</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Reason:</label>
        <textarea name="reason" required></textarea>

        <label>From Date:</label>
        <input type="date" name="from_date" required>

        <label>To Date:</label>
        <input type="date" name="to_date" required>

        <button type="submit" class="btn">Apply Leave</button>
    </form>

    <a href="{% url 'employee_dashboard' %}" class="back-link">← Back to Dashboard</a>

</div>

</body>
</html>
